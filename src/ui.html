<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lunch Uncle</title>
  <style>
    :root {
      --bg: #f9fafb; --surface: #ffffff; --line: #e5e7eb; --ink: #1f2937; --muted: #6b7280;
      --uncle: #fde68a; --uncle-ink: #1f2937; --you: #dbeafe; --you-ink: #1f2937;
      --accent: #1f2937; --accent-ink: #ffffff; --chip: #fff7d6; --chip-line: #f5d565;
      --error: #fee2e2; --error-ink: #7f1d1d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --surface: #1f2937; --line: #374151; --ink: #f3f4f6; --muted: #9ca3af;
        --uncle: #78591c; --uncle-ink: #fef3c7; --you: #1e3a5f; --you-ink: #e0f2fe;
        --accent: #fbbf24; --accent-ink: #111827; --chip: #2a2416; --chip-line: #78591c;
        --error: #4c1d1d; --error-ink: #fecaca;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg);
      display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    }
    header {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1rem; padding-top: max(.75rem, env(safe-area-inset-top));
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    header .titles { flex: 1; min-width: 0; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header p { margin: .15rem 0 0; color: var(--muted); font-size: .85rem; }
    #new-chat {
      background: transparent; color: var(--ink); border: 1px solid var(--line);
      padding: .45rem .8rem; font-size: .9rem;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: .5rem;
    }
    .bubble {
      max-width: min(75%, 36rem); padding: .6rem .9rem; border-radius: 1rem; line-height: 1.45;
      word-wrap: break-word; overflow-wrap: anywhere;
    }
    .bubble p { margin: 0 0 .5rem; }
    .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: 0 0 .5rem; padding-left: 1.25rem; }
    .uncle { background: var(--uncle); color: var(--uncle-ink); align-self: flex-start; border-bottom-left-radius: .25rem; }
    .you { background: var(--you); color: var(--you-ink); align-self: flex-end; border-bottom-right-radius: .25rem; white-space: pre-wrap; }
    .error { background: var(--error); color: var(--error-ink); }
    .status { display: block; font-size: .8rem; opacity: .75; margin-top: .25rem; }
    .dots span {
      display: inline-block; width: .45rem; height: .45rem; margin-right: .2rem; border-radius: 50%;
      background: currentColor; opacity: .3; animation: blink 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }
    .retry {
      margin-top: .5rem; background: transparent; color: inherit; border: 1px solid currentColor;
      padding: .3rem .7rem; font-size: .85rem;
    }
    #chips { display: flex; flex-wrap: wrap; gap: .5rem; padding: 0 1rem .75rem; }
    #chips[hidden] { display: none; }
    .chip {
      background: var(--chip); color: var(--ink); border: 1px solid var(--chip-line);
      border-radius: 999px; padding: .45rem .85rem; font-size: .9rem;
    }
    form {
      display: flex; gap: .5rem; padding: .75rem 1rem;
      padding-bottom: max(.75rem, env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line);
    }
    input {
      flex: 1; min-width: 0; padding: .6rem .9rem; font-size: 1rem; /* 16px stops iPhone zooming in */
      color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: .5rem;
    }
    button {
      padding: .6rem 1.2rem; font-size: 1rem; border: 0; border-radius: .5rem;
      background: var(--accent); color: var(--accent-ink); cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="titles">
      <h1>Lunch Uncle</h1>
      <p>Tell Uncle what you feel like eating. He is at CT Hub 2, Lavender.</p>
    </div>
    <button id="new-chat" type="button">New chat</button>
  </header>

  <div id="chat" role="log" aria-live="polite" aria-label="Conversation with Uncle"></div>

  <div id="chips" aria-label="Suggested questions">
    <button class="chip" type="button">Cheap and fast lah</button>
    <button class="chip" type="button">Somewhere with aircon</button>
    <button class="chip" type="button">Will it rain later?</button>
    <button class="chip" type="button">Uncle, decide for me</button>
  </div>

  <form id="form">
    <label for="input" class="sr-only">Your message to Uncle</label>
    <input id="input" placeholder="Uncle, where to eat?" autocomplete="off" maxlength="2000" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const chips = document.getElementById("chips");
    const newChat = document.getElementById("new-chat");

    const GREETING = "Eh, what you want to eat? Don't waste my time.";
    const STORAGE_KEY = "lunch-uncle-chat";
    // The server only reads the latest 20 messages (MAX_HISTORY_MESSAGES in
    // src/loop.js), so don't keep, save or send more than that.
    const MAX_HISTORY_MESSAGES = 20;

    // Conversation so far, in the shape the /chat endpoint expects, plus one
    // id for the whole conversation so the AI provider can reuse its cache.
    let history = [];
    let sessionId = crypto.randomUUID();
    let busy = false;

    // --- Saving the conversation so a refresh doesn't lose it -------------
    // Browser storage can be blocked (private windows), so never rely on it.
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, sessionId }));
      } catch {}
    }
    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.history) && typeof saved.sessionId === "string") {
          history = saved.history.slice(-MAX_HISTORY_MESSAGES);
          sessionId = saved.sessionId;
        }
      } catch {}
    }

    // --- Turning Uncle's **bold** and lists into real formatting ----------
    // Escape everything first, so text from the AI can never inject HTML.
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }
    function inline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
    }
    function renderMarkdown(text) {
      const blocks = [];
      let list = null;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        const bullet = line.match(/^[-*•]\s+(.*)$/);
        const numbered = line.match(/^\d+[.)]\s+(.*)$/);
        const item = bullet || numbered;
        if (item) {
          const tag = bullet ? "ul" : "ol";
          if (!list || list.tag !== tag) {
            list = { tag, items: [] };
            blocks.push(list);
          }
          list.items.push(inline(item[1]));
          continue;
        }
        list = null;
        if (line) blocks.push({ p: inline(line) });
      }
      return blocks
        .map((b) => b.p !== undefined
          ? `<p>${b.p}</p>`
          : `<${b.tag}>${b.items.map((i) => `<li>${i}</li>`).join("")}</${b.tag}>`)
        .join("");
    }

    // --- Bubbles ----------------------------------------------------------
    function scrollDown() {
      chat.scrollTop = chat.scrollHeight;
    }
    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = `bubble ${role === "user" ? "you" : "uncle"}`;
      if (role === "user") {
        div.textContent = text;
      } else {
        div.innerHTML = renderMarkdown(text);
      }
      chat.appendChild(div);
      scrollDown();
      return div;
    }
    function showThinking() {
      const div = addBubble("assistant", "");
      div.setAttribute("aria-label", "Uncle is thinking");
      div.innerHTML = '<span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>' +
        '<span class="status"></span>';
      const status = div.querySelector(".status");
      // Long waits are normal (Uncle searches and checks the weather), so
      // tell the user it's still working instead of looking frozen.
      const timers = [
        setTimeout(() => { status.textContent = "Uncle checking the area..."; }, 4000),
        setTimeout(() => { status.textContent = "Still thinking, don't rush him..."; }, 12000),
      ];
      return { div, stop: () => timers.forEach(clearTimeout) };
    }
    function showError(div, text, message) {
      div.className = "bubble uncle error";
      div.removeAttribute("aria-label");
      div.textContent = text;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "retry";
      retry.textContent = "Try again";
      retry.addEventListener("click", () => {
        div.remove();
        // The user's bubble is already on screen, so don't add it twice.
        ask(message, { showUser: false });
      });
      div.appendChild(document.createElement("br"));
      div.appendChild(retry);
      scrollDown();
    }

    // --- Talking to Uncle -------------------------------------------------
    async function ask(message, { showUser = true } = {}) {
      if (busy) return;
      busy = true;
      send.disabled = true;
      chips.hidden = true;
      if (showUser) addBubble("user", message);
      const thinking = showThinking();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ history, message, session_id: sessionId }),
        });
        let data = {};
        try {
          data = await res.json();
        } catch {}
        thinking.stop();

        if (res.ok && data.reply) {
          thinking.div.removeAttribute("aria-label");
          thinking.div.innerHTML = renderMarkdown(data.reply);
          // Only remember real replies, not error messages.
          history.push({ role: "user", content: message });
          history.push({ role: "assistant", content: data.reply });
          history = history.slice(-MAX_HISTORY_MESSAGES);
          save();
        } else {
          showError(thinking.div, data.error || "Uncle got nothing to say. Try again.", message);
        }
      } catch {
        thinking.stop();
        showError(thinking.div, "Cannot reach Uncle. Check your connection.", message);
      } finally {
        busy = false;
        send.disabled = false;
        scrollDown();
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      input.value = "";
      ask(message);
    });

    chips.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (chip && !busy) ask(chip.textContent);
    });

    newChat.addEventListener("click", () => {
      if (busy) return;
      history = [];
      sessionId = crypto.randomUUID();
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      start();
      input.focus();
    });

    // --- Start ------------------------------------------------------------
    function start() {
      chat.innerHTML = "";
      addBubble("assistant", GREETING);
      for (const m of history) addBubble(m.role, m.content);
      chips.hidden = history.length > 0;
    }

    load();
    start();
  </script>
</body>
</html>
