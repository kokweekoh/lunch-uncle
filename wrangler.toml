name = "lunch-uncle"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Serve the chat page from a plain HTML file, imported as a string.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Rate limit for POST /chat: 10 requests per 60 seconds per visitor IP.
# namespace_id is any number unique within your Cloudflare account.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (OPENCODE_API_KEY, GOOGLE_PLACES_API_KEY) are set with
# `wrangler secret put` for deploys and `.env` for local development.
# Never put them in this file.
